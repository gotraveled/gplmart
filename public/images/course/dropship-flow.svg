<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="system-ui,sans-serif">
  <rect width="800" height="450" rx="16" fill="#0c0f14"/>
  <text x="40" y="52" fill="#e6e9ef" font-size="20" font-weight="700">Dropshipping flow</text>
  <text x="40" y="78" fill="#8b95a7" font-size="13">How an order moves - you never touch the product</text>
  <g font-size="13" font-weight="600">
    <rect x="40" y="120" width="150" height="80" rx="12" fill="#161c26" stroke="#2a3342"/>
    <text x="60" y="152" fill="#e6e9ef">1. Customer</text><text x="60" y="174" fill="#8b95a7" font-size="11.5">orders on YOUR store</text>
    <rect x="240" y="120" width="150" height="80" rx="12" fill="#161c26" stroke="#2a3342"/>
    <text x="260" y="152" fill="#e6e9ef">2. You</text><text x="260" y="174" fill="#8b95a7" font-size="11.5">forward order + pay supplier</text>
    <rect x="440" y="120" width="150" height="80" rx="12" fill="#161c26" stroke="#2a3342"/>
    <text x="460" y="152" fill="#e6e9ef">3. Supplier</text><text x="460" y="174" fill="#8b95a7" font-size="11.5">CJ/AliExpress ships direct</text>
    <rect x="640" y="120" width="130" height="80" rx="12" fill="#161c26" stroke="#2a3342"/>
    <text x="658" y="152" fill="#e6e9ef">4. Customer</text><text x="658" y="174" fill="#8b95a7" font-size="11.5">gets tracking</text>
  </g>
  <g stroke="#6ee7b7" stroke-width="2.5" fill="none" marker-end="url(#arr)">
    <line x1="190" y1="160" x2="238" y2="160"/><line x1="390" y1="160" x2="438" y2="160"/><line x1="590" y1="160" x2="638" y2="160"/>
  </g>
  <defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#6ee7b7"/></marker></defs>
  <rect x="40" y="240" width="720" height="170" rx="12" fill="#10151d" stroke="#2a3342"/>
  <text x="64" y="274" fill="#7cc4ff" font-size="15" font-weight="700">India vs international</text>
  <g font-size="12.5" fill="#8b95a7">
    <text x="64" y="304">🇮🇳 India: faster shipping (5-12 days), COD essential, Razorpay/UPI, price in ₹</text>
    <text x="64" y="330">🌍 International: longer shipping (10-25 days), card-only mostly, Stripe/PayPal, price in $</text>
    <text x="64" y="366" fill="#6ee7b7" font-size="13" font-weight="600">Rule: sell where shipping time + payment method match buyer expectations.</text>
  </g>
</svg>
