name: video-scripts

# Stage 1 of the AI video course: generates narration scripts + SRT-style
# captions for lessons that don't have video assets yet. Separate from the
# daily content workflow so it doesn't add load - runs weekly, 3 lessons/run.
#
# Secrets: GEMINI_API_KEYS (same as daily-content). Later stages (TTS audio,
# MP4 assembly) will be added as separate workflows.

on:
  schedule:
    - cron: "0 5 * * 1" # Mondays 05:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Generate video scripts
        run: node scripts/generate-video-scripts.mjs
        env:
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS || secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.5-flash' }}
          VIDEO_SCRIPTS_PER_RUN: ${{ vars.VIDEO_SCRIPTS_PER_RUN || '3' }}
      - name: Commit scripts
        run: |
          mkdir -p lib
          git config user.name "gplmart-content-bot"
          git config user.email "content-bot@gplmart.com"
          git add lib/video-scripts.json .video-state.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "No new scripts."; exit 0; fi
          git commit -m "Video scripts batch"
          git push
